<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Show Tracker – dcbgi</title>
  <!-- ── Styles ──────────────────────────────────────────────────────────────
       shared.css provides the design tokens (CSS custom properties), reset,
       base body / link styles, and the shared navbar layout.
       tvtracker.css adds the layout and components specific to this page.
  ──────────────────────────────────────────────────────────────────────── -->
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="tvtracker.css" />
</head>
<body>

  <!-- ── Navigation ──────────────────────────────────────────────────────────
       Sticky top bar. The logo is a plain <span> (not a link) because this
       is a sub-page; the "← Back" anchor navigates to index.html.
  ──────────────────────────────────────────────────────────────────────── -->
  <nav class="navbar">
    <span class="nav-logo">Berry Better Solutions</span>
    <a href="index.html" class="nav-back">← Back to Profile</a>
  </nav>

  <main>

    <div class="page-header">
      <h1>📺 <span class="accent">TV Show Tracker</span></h1>
      <p>Log every show and episode you watch — with ratings</p>
    </div>

    <!-- ── Add Show ───────────────────────────────────────────────────────────
         Simple text input + submit button. The "submit" event is handled in
         the script below, which creates a new show object and saves it to
         localStorage.
    ──────────────────────────────────────────────────────────────────────── -->
    <div class="panel" id="add-panel">
      <div class="panel-title">Add a New Show</div>
      <form class="add-show-form" id="add-show-form" autocomplete="off">
        <input
          type="text"
          id="show-input"
          placeholder="Enter show title…"
          maxlength="120"
          aria-label="Show title"
        />
        <button type="submit" class="btn btn-primary">+ Add Show</button>
      </form>
    </div>

    <!-- ── Currently Watching ────────────────────────────────────────────────
         Dynamically populated by the render() function below.
         Shows with status === "watching" appear here.
         The badge count is updated on every render.
    ──────────────────────────────────────────────────────────────────────── -->
    <div class="panel" id="watching-panel">
      <div class="panel-title">
        Currently Watching
        <span class="badge" id="watching-count">0</span>
      </div>
      <div class="shows-list" id="watching-list">
        <div class="empty-state">
          <div class="empty-icon">🎬</div>
          <p>No shows yet — add one above!</p>
        </div>
      </div>
    </div>

    <!-- ── Completed ──────────────────────────────────────────────────────────
         Shows with status === "completed" are moved here when the user clicks
         "Mark Complete". They can be moved back to Watching at any time.
    ──────────────────────────────────────────────────────────────────────── -->
    <div class="panel" id="completed-panel">
      <div class="panel-title">
        Completed
        <span class="badge" id="completed-count">0</span>
      </div>
      <div class="shows-list" id="completed-list">
        <div class="empty-state">
          <div class="empty-icon">✅</div>
          <p>No completed shows yet.</p>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; <span id="year"></span> dcbgi. TV Show Tracker — data saved in your browser.</p>
  </footer>

  <!-- script loaded at the end of <body> so all DOM elements are available -->
  <script src="tvtracker.js"></script>

</body>
</html>
