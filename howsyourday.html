<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How's Your Day? – dcbgi</title>
  <!-- ── Styles ──────────────────────────────────────────────────────────────
       shared.css provides the design tokens (CSS custom properties), reset,
       base body / link styles, and the shared navbar layout.
       howsyourday.css adds the layout and components specific to this page.
  ──────────────────────────────────────────────────────────────────────── -->
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="howsyourday.css" />
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────────────
       Sticky top bar with the site logo and a back link to the portfolio.
       Using aria-label on the <nav> helps screen readers announce the
       landmark region correctly.
  ──────────────────────────────────────────────────────────────────────── -->
  <nav class="navbar" aria-label="Site navigation">
    <a href="index.html" class="nav-logo">Berry Better Solutions</a>
    <a href="index.html" class="nav-back">← Back to Portfolio</a>
  </nav>

  <!-- ── Main content ────────────────────────────────────────────────────────
       The main area contains the heading and the grid of mood buttons.
       Each button carries two data-* attributes:
         data-emoji  — the emoji character to display in the overlay
         data-label  — the mood description shown below the emoji
       The script below reads these attributes when a button is clicked.
  ──────────────────────────────────────────────────────────────────────── -->
  <main>
    <h1 class="question">How's your <span>day</span>?</h1>

    <div class="mood-buttons" role="group" aria-label="Mood choices">
      <button class="mood-btn" data-emoji="🤩" data-label="Amazing!" aria-label="Amazing">
        <span class="btn-emoji" aria-hidden="true">🤩</span>
        <span class="btn-label">Amazing!</span>
      </button>
      <button class="mood-btn" data-emoji="😊" data-label="Pretty good" aria-label="Pretty good">
        <span class="btn-emoji" aria-hidden="true">😊</span>
        <span class="btn-label">Pretty good</span>
      </button>
      <button class="mood-btn" data-emoji="😐" data-label="Just okay" aria-label="Just okay">
        <span class="btn-emoji" aria-hidden="true">😐</span>
        <span class="btn-label">Just okay</span>
      </button>
      <button class="mood-btn" data-emoji="😕" data-label="Not great" aria-label="Not great">
        <span class="btn-emoji" aria-hidden="true">😕</span>
        <span class="btn-label">Not great</span>
      </button>
      <button class="mood-btn" data-emoji="😢" data-label="Terrible" aria-label="Terrible">
        <span class="btn-emoji" aria-hidden="true">😢</span>
        <span class="btn-label">Terrible</span>
      </button>
    </div>
  </main>

  <!-- ── Emoji overlay ────────────────────────────────────────────────────────
       Hidden full-screen overlay (opacity: 0; pointer-events: none by default).
       When a mood button is clicked, the JS adds the "visible" class which
       fades it in and re-enables pointer events.
       role="dialog" + aria-modal="true" signals to screen readers that this
       is a modal interaction; aria-label gives it an accessible name.
  ──────────────────────────────────────────────────────────────────────── -->
  <div class="emoji-overlay" id="emoji-overlay" role="dialog" aria-modal="true" aria-label="Mood response">
    <div class="overlay-emoji" id="overlay-emoji" aria-hidden="true"></div>
    <div class="overlay-label" id="overlay-label"></div>
    <div class="overlay-hint">Click anywhere to close</div>
  </div>

  <footer>
    &copy; <span id="year"></span> dcbgi
  </footer>

  <!-- script loaded at the end of <body> so all DOM elements are available -->
  <script src="howsyourday.js"></script>
</body>
</html>
