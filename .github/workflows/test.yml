name: Tests

# Run the Jest suite on every push and pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache ~/.npm keyed off package-lock.json so reruns skip the download
          cache: npm

      # npm ci installs exactly what package-lock.json pins, and fails loudly
      # if the lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
