name: Deploy to Nixihost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H iah-s04.nixihost.com >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh berrybet@iah-s04.nixihost.com << 'DEPLOY'
          cd /home/berrybet/repositories/Site
          git pull origin main
          export DEPLOYPATH=/home/berrybet/public_html/
          /bin/cp -v shared.css $DEPLOYPATH
          /bin/cp -v index.html $DEPLOYPATH
          /bin/cp -v styles.css $DEPLOYPATH
          /bin/cp -v script.js $DEPLOYPATH
          /bin/cp -v experiences/tvtracker/index.html $DEPLOYPATH/tvtracker.html
          /bin/cp -v experiences/tvtracker/style.css $DEPLOYPATH/tvtracker.css
          /bin/cp -v experiences/tvtracker/script.js $DEPLOYPATH/tvtracker.js
          /bin/cp -v experiences/howsyourday/index.html $DEPLOYPATH/howsyourday.html
          /bin/cp -v experiences/howsyourday/style.css $DEPLOYPATH/howsyourday.css
          /bin/cp -v experiences/howsyourday/script.js $DEPLOYPATH/howsyourday.js
          /bin/cp -v experiences/codecracker/index.html $DEPLOYPATH/codecracker.html
          /bin/cp -v experiences/codecracker/style.css $DEPLOYPATH/codecracker.css
          /bin/cp -v experiences/codecracker/script.js $DEPLOYPATH/codecracker.js
          DEPLOY
