<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Show Tracker – dcbgi</title>
  <link rel="stylesheet" href="../../shared.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="../../index.html" class="nav-logo">Berry Better Solutions</a>
    <a href="../../index.html" class="nav-back">← Back to Home</a>
  </nav>

  <main>

    <div class="page-header">
      <h1>📺 <span class="accent">TV Show Tracker</span></h1>
      <p>Log every show and episode you watch — with ratings</p>
    </div>

    <div class="panel" id="add-panel">
      <div class="panel-title">Add a New Show</div>
      <form class="add-show-form" id="add-show-form" autocomplete="off">
        <input
          type="text"
          id="show-input"
          placeholder="Enter show title…"
          maxlength="120"
          aria-label="Show title"
        />
        <button type="submit" class="btn btn-primary">+ Add Show</button>
      </form>
    </div>

    <div class="panel" id="watching-panel">
      <div class="panel-title">
        Currently Watching
        <span class="badge" id="watching-count">0</span>
      </div>
      <div class="shows-list" id="watching-list">
        <div class="empty-state">
          <div class="empty-icon">🎬</div>
          <p>No shows yet — add one above!</p>
        </div>
      </div>
    </div>

    <div class="panel" id="completed-panel">
      <div class="panel-title">
        Completed
        <span class="badge" id="completed-count">0</span>
      </div>
      <div class="shows-list" id="completed-list">
        <div class="empty-state">
          <div class="empty-icon">✅</div>
          <p>No completed shows yet.</p>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; <span id="year"></span> dcbgi. TV Show Tracker — data saved in your browser.</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
